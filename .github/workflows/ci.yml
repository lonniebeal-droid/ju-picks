name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jupicks
          POSTGRES_PASSWORD: jupicks_ci
          POSTGRES_DB: jupicks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jupicks -d jupicks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jupicks:jupicks_ci@localhost:5432/jupicks_test
      CI: "true"
      REAL_MONEY_ENABLED: "false"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect lockfile
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies from lockfile
        if: steps.lockfile.outputs.has_lockfile == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install dependencies without lockfile
        if: steps.lockfile.outputs.has_lockfile != 'true'
        run: npm install --no-audit --no-fund

      - name: Apply migrations
        run: node scripts/migrate.mjs

      - name: Pure settlement tests
        run: node tests/run-pure-engine.mjs

      - name: Persistence static tests
        run: node tests/run-persistence-static.mjs

      - name: Database integration tests
        run: node scripts/db-integration.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
